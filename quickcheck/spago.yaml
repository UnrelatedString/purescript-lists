package:
  name: lists-spec-tests
  description: spago@next-enabled tests for lists using packages that depend on it
  dependencies:
    - prelude: ">=6.0.2 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - quickcheck: ">=8.0.1 <9.0.0"
    - spec: ">=8.1.1 <9.0.0"
    - spec-quickcheck: ">=5.0.2 <6.0.0"
    - spec-node: ">=0.0.3 <0.1.0"
  test:
    main: Test.Main
    dependencies:
      []
workspace:
  packageSet:
    registry: 64.6.0
  extraPackages:
    lists:
      path: ..
      dependencies:
      - bifunctors
      - control
      - foldable-traversable
      - lazy
      - maybe
      - newtype
      - nonempty
      - partial
      - prelude
      - tailrec
      - tuples
      - unfoldable
